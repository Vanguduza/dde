<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>overview.ready — visual fixture</title>
<style>
  body {
    margin: 0;
    padding: var(--space-4);
    background: var(--bg);
    color: var(--fg);
    font-family: var(--type-font-family-body);
    font-size: var(--type-body);
    line-height: 1.45;
  }
  h1 { font-size: var(--type-lg); font-weight: 600; margin: 0 0 var(--space-1); }
  .strip {
    display: flex;
    align-items: center;
    gap: var(--space-2);
    flex-wrap: wrap;
    border: 1px solid var(--border-default);
    background: var(--surface-card);
    border-radius: var(--radius-lg);
    padding: var(--space-3) var(--space-4);
    margin: var(--space-3) 0;
  }
  .pill {
    display: inline-block;
    padding: 2px var(--space-2);
    border-radius: var(--radius-md);
    border: 1px solid var(--border-default);
    font-size: var(--type-xs);
  }
  .pill.ok { border-color: var(--ok-border-line); color: var(--status-ok); }
  .pill.warn { border-color: var(--warn-border-line); color: var(--status-warn); }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: var(--space-2);
    margin: var(--space-3) 0;
  }
  .card {
    border: 1px solid var(--border-default);
    border-radius: var(--radius-md);
    padding: var(--space-3);
    background: var(--surface-card);
  }
  .card strong { display: block; margin-bottom: var(--space-1); }
  .muted { color: var(--text-muted); }
</style>
</head>
<body data-sample="demo">
<main id="main">
  <h1>Overview · ready</h1>
  <div class="strip" role="status">
    <strong>Core ready</strong>
    <span class="pill ok">local</span>
    <span class="muted">http://127.0.0.1:8000</span>
  </div>
  <div class="grid">
    <section class="card">
      <strong>Truth</strong>
      <span class="muted">Constitution loaded</span>
    </section>
    <section class="card">
      <strong>Graph</strong>
      <span class="muted">12 tasks</span>
    </section>
    <section class="card">
      <strong>Verify</strong>
      <span class="muted">Gates green</span>
    </section>
  </div>
</main>
</body>
</html>
