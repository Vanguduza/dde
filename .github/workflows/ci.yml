name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dde
          POSTGRES_PASSWORD: dde
          POSTGRES_DB: dde
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dde -d dde"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DDE_DATABASE_URL: postgresql+asyncpg://dde:dde@localhost:5432/dde
      DDE_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: extractions/setup-just@v2
      - name: Install
        run: uv sync --group dev
      - name: Lint
        run: just lint
      - name: Typecheck
        run: just typecheck
      - name: Contract drift check
        run: just contract-test
      - name: Design lints (shrink-only budget)
        run: just design-lints
      - name: Unit tests
        run: just test
      - name: Migration validation (empty database, reversible)
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
      - name: Integration
        run: uv run pytest tests/integration
      - name: Fail on generated drift
        run: |
          uv run python -m scripts.generate_contracts
          uv run python -m scripts.generate_design_tokens
          git diff --exit-code -- engine/contracts schemas/sql schemas/api/openapi.yaml docs/blueprint/generated interfaces/dde-studio/shared/ui/tokens.ts

  windows:
    # The ubuntu ci job is authoritative (services, migrations, integration).
    # This job proves the repo stays green on a bare Windows host: same lint,
    # typecheck and contract drift gates, plus the pure unit suite via
    # `just test-unit` (no PostgreSQL/Redis required).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: extractions/setup-just@v2
      - name: Install
        run: uv sync --group dev
      - name: Lint
        run: just lint
      - name: Typecheck
        run: just typecheck
      - name: Pure unit tests
        run: just test-unit
