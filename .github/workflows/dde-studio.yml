name: DDE Studio

on:
  push:
    paths:
      - "interfaces/dde-studio/**"
      - "schemas/design/**"
      - "scripts/generate_design_tokens.py"
      - "scripts/design_lints.py"
      - "docs/design/lint-baseline.json"
      - ".github/workflows/dde-studio.yml"
  pull_request:
    paths:
      - "interfaces/dde-studio/**"
      - "schemas/design/**"
      - "scripts/generate_design_tokens.py"
      - "scripts/design_lints.py"
      - "docs/design/lint-baseline.json"
      - ".github/workflows/dde-studio.yml"

jobs:
  compile:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: interfaces/dde-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: interfaces/dde-studio/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck / compile extension
        run: npm run check
      - name: Client tests (PR-blocking)
        run: npm test
      - name: Emit JS
        run: npm run compile
      - name: Install desktop
        working-directory: interfaces/dde-studio/desktop
        run: npm ci
      - name: Typecheck desktop
        working-directory: interfaces/dde-studio/desktop
        run: npm run check

  design-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Token sheet drift check (SSOT law)
        run: uv run python -m scripts.generate_design_tokens --check
      - name: Design lints (shrink-only budget)
        run: uv run python -m scripts.design_lints --baseline
