name: Project Truth Autolog

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: project-truth-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  project-truth:
    name: Track and verify repository truth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate canonical-state manifest
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, pathlib, sys
          p = pathlib.Path('PROJECT_CANONICAL_STATE.json')
          if not p.exists():
              sys.exit('BLOCKED: PROJECT_CANONICAL_STATE.json is missing')
          data = json.loads(p.read_text())
          if data.get('repository') != os.environ['GITHUB_REPOSITORY']:
              sys.exit(f"BLOCKED: manifest repository={data.get('repository')} expected={os.environ['GITHUB_REPOSITORY']}")
          if not data.get('policy', {}).get('default_branch_is_not_authority'):
              sys.exit('BLOCKED: default-branch-is-not-authority policy missing')
          print('project-truth: canonical-state manifest valid')
          PY

      - name: Automatically record pushed commits
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        shell: bash
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
          PUSH_BRANCH: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import datetime as dt, hashlib, json, os, pathlib, subprocess

          before = os.environ.get('PUSH_BEFORE','')
          after = os.environ['PUSH_AFTER']
          branch = os.environ['PUSH_BRANCH']
          zero = '0' * 40
          ledger = pathlib.Path('docs/project-state/CHANGE_LEDGER.jsonl')
          current = pathlib.Path('docs/project-state/CURRENT_STATE.json')
          ledger.parent.mkdir(parents=True, exist_ok=True)

          def out(*args):
              return subprocess.check_output(['git', *args], text=True).strip()

          existing_lines = ledger.read_text(encoding='utf-8').splitlines() if ledger.exists() else []
          existing = set()
          for line in existing_lines:
              try:
                  existing.add(json.loads(line).get('commit_sha'))
              except Exception:
                  pass

          usable_before = bool(before and before != zero and subprocess.run(['git','cat-file','-e',before+'^{commit}'], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL).returncode == 0)
          commits = out('rev-list','--reverse',f'{before}..{after}').splitlines() if usable_before else [after]
          appended = []
          for sha in commits:
              if not sha or sha in existing:
                  continue
              files = [x for x in out('diff-tree','--root','--no-commit-id','--name-only','-r',sha).splitlines() if x]
              if files and all(x.startswith('docs/project-state/') for x in files):
                  continue
              p = subprocess.run(['git','rev-parse',sha+'^1'], text=True, capture_output=True)
              parent = p.stdout.strip() if p.returncode == 0 else None
              patch = subprocess.check_output(['git','show','--binary','--format=','--no-ext-diff',sha])
              entry = {
                  'schema_version': 1,
                  'recorded_at_utc': dt.datetime.now(dt.timezone.utc).isoformat(),
                  'repository': os.environ['GITHUB_REPOSITORY'],
                  'branch': branch,
                  'commit_sha': sha,
                  'parent_sha': parent,
                  'tree_sha': out('show','-s','--format=%T',sha),
                  'author_name': out('show','-s','--format=%an',sha),
                  'author_email': out('show','-s','--format=%ae',sha),
                  'authored_at': out('show','-s','--format=%aI',sha),
                  'subject': out('show','-s','--format=%s',sha),
                  'changed_files': files,
                  'diff_sha256': hashlib.sha256(patch).hexdigest(),
                  'github_actor': os.environ.get('GITHUB_ACTOR','unknown')
              }
              existing_lines.append(json.dumps(entry, sort_keys=True, separators=(',',':')))
              appended.append(entry)

          if appended:
              ledger.write_text('\n'.join(existing_lines) + '\n', encoding='utf-8')
          snapshot = {
              'schema_version': 1,
              'repository': os.environ['GITHUB_REPOSITORY'],
              'branch': branch,
              'source_commit': after,
              'source_tree': out('show','-s','--format=%T',after),
              'observed_at_utc': dt.datetime.now(dt.timezone.utc).isoformat(),
              'recorded_commit_count': len(appended)
          }
          current.write_text(json.dumps(snapshot, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(f'project-truth: recorded {len(appended)} pushed commit(s)')
          PY

          if git diff --quiet -- docs/project-state/; then
            echo "project-truth: ledger already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/project-state/CHANGE_LEDGER.jsonl docs/project-state/CURRENT_STATE.json
          git commit -m "chore(project-truth): autolog ${GITHUB_SHA::12} [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Enforce release block on tag refs
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          python3 - <<'PY'
          import json, sys
          data=json.load(open('PROJECT_CANONICAL_STATE.json'))
          state=data.get('canonical_state',{})
          if state.get('release_blocked', True):
              sys.exit('BLOCKED: release/tag created while canonical_state.release_blocked=true')
          print('project-truth: release gate open')
          PY
