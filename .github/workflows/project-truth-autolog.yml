name: Project Truth Guard
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: project-truth-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  project-truth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate canonical-state manifest
        run: |
          python3 - <<'PY'
          import json,os,pathlib,sys
          p=pathlib.Path('PROJECT_CANONICAL_STATE.json')
          if not p.exists(): sys.exit('BLOCKED: PROJECT_CANONICAL_STATE.json is missing')
          d=json.loads(p.read_text())
          if d.get('repository')!=os.environ['GITHUB_REPOSITORY']: sys.exit('BLOCKED: manifest repository mismatch')
          if not d.get('policy',{}).get('default_branch_is_not_authority'): sys.exit('BLOCKED: authority policy missing')
          if d.get('policy',{}).get('protected_main_ci_is_read_only') is not True: sys.exit('BLOCKED: protected-main read-only CI policy missing')
          PY
      - name: Verify durable Project Truth ledger
        run: python3 scripts/project_truth_local.py verify
      - name: Block unresolved release tags
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: |
          python3 - <<'PY'
          import json,sys
          if json.load(open('PROJECT_CANONICAL_STATE.json')).get('canonical_state',{}).get('release_blocked',True): sys.exit('BLOCKED: unresolved canonical state')
          PY
