name: VEKL Rev2 reconstruction helper

on:
  push:
    branches:
      - feat/vekl-automation-corpus-runtime-20260916

permissions:
  contents: write

jobs:
  reconstruct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/vekl-automation-corpus-runtime-20260916
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --group dev
      - name: Configure reconstruction identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Reconcile 0040 fresh-schema compatibility
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("migrations/versions/0040_source_intelligence_automation_corpus.py")
          text = path.read_text(encoding="utf-8")
          needle = '''def upgrade() -> None:\n    _create_source_tables()\n    _create_automation_tables()\n    for table in _NEW_TABLES:\n        _enable_rls(table)\n    _backfill_design_sources()\n    _rewire_vekl_to_neutral()\n'''
          replacement = '''def _existing_0040_tables() -> set[str]:\n    connection = op.get_bind()\n    return {\n        table\n        for table in _NEW_TABLES\n        if connection.execute(\n            sa.text("SELECT to_regclass(:name)"), {"name": f"public.{table}"}\n        ).scalar()\n        is not None\n    }\n\n\ndef upgrade() -> None:\n    existing = _existing_0040_tables()\n    if existing:\n        if existing != set(_NEW_TABLES):\n            missing = sorted(set(_NEW_TABLES) - existing)\n            raise RuntimeError(\n                "partial Source Intelligence schema detected before migration 0040; "\n                f"missing tables: {', '.join(missing)}"\n            )\n    else:\n        _create_source_tables()\n        _create_automation_tables()\n        for table in _NEW_TABLES:\n            _enable_rls(table)\n    _backfill_design_sources()\n    _rewire_vekl_to_neutral()\n'''
          if needle in text:
              text = text.replace(needle, replacement)
              path.write_text(text, encoding="utf-8")
          elif "def _existing_0040_tables()" not in text:
              raise SystemExit("0040 upgrade block did not match expected source")
          PY
          uv run ruff format migrations/versions/0040_source_intelligence_automation_corpus.py tests/integration/test_automation_corpus_rev2.py
          git add migrations/versions/0040_source_intelligence_automation_corpus.py tests/integration/test_automation_corpus_rev2.py .github/workflows/ci.yml
          if ! git diff --cached --quiet; then
            git commit -m "test(vekl): certify Source Intelligence migration and RLS"
          fi
      - name: Generate canonical contract outputs
        shell: bash
        run: |
          uv run python -m scripts.generate_contracts
          git add engine/contracts schemas/sql/0001_stage1.sql schemas/sql/0001_stage1_down.sql docs/blueprint/generated/objects.md
          if ! git diff --cached --quiet; then
            git commit -m "chore(contracts): regenerate Source Intelligence outputs"
          fi
      - name: Backfill exact API-created commit evidence
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime as dt
          import hashlib
          import json
          import pathlib
          import subprocess

          ledger = pathlib.Path("docs/project-state/CHANGE_LEDGER.jsonl")
          current = pathlib.Path("docs/project-state/CURRENT_STATE.json")
          excludes = [
              ":(exclude)docs/project-state/CHANGE_LEDGER.jsonl",
              ":(exclude)docs/project-state/CURRENT_STATE.json",
          ]
          lines = ledger.read_text(encoding="utf-8").splitlines() if ledger.exists() else []
          existing = []
          for line in lines:
              try:
                  row = json.loads(line)
              except json.JSONDecodeError:
                  continue
              if isinstance(row, dict):
                  existing.append(row)
          base = subprocess.check_output(["git", "merge-base", "origin/main", "HEAD"], text=True).strip()
          commits = subprocess.check_output(["git", "rev-list", "--reverse", f"{base}..HEAD"], text=True).splitlines()
          added = []
          for sha in commits:
              parent = subprocess.check_output(["git", "rev-parse", f"{sha}^1"], text=True).strip()
              files = subprocess.check_output(
                  ["git", "diff", "--name-only", "--no-renames", parent, sha, "--", ".", *excludes], text=True
              ).splitlines()
              if not files or all(name.startswith("docs/project-state/") for name in files):
                  continue
              patch = subprocess.check_output(
                  ["git", "diff", "--binary", "--no-ext-diff", "--no-renames", parent, sha, "--", ".", *excludes]
              )
              digest = hashlib.sha256(patch).hexdigest()
              if any(row.get("commit_sha") == sha and row.get("diff_sha256") == digest for row in existing):
                  continue
              row = {
                  "schema_version": 1,
                  "kind": "commit-backfill",
                  "recorded_at_utc": dt.datetime.now(dt.UTC).isoformat(),
                  "branch": "feat/vekl-automation-corpus-runtime-20260916",
                  "commit_sha": sha,
                  "source_parent": parent,
                  "changed_files": files,
                  "diff_sha256": digest,
                  "actor": "github-actions[bot]:vekl-rev2-reconstruction",
              }
              lines.append(json.dumps(row, sort_keys=True, separators=(",", ":")))
              existing.append(row)
              added.append(row)
          if added:
              ledger.write_text("\n".join(lines) + "\n", encoding="utf-8")
              current.write_text(
                  json.dumps(
                      {
                          "schema_version": 1,
                          "state": "API_COMMIT_BACKFILL_RECONCILED",
                          "branch": "feat/vekl-automation-corpus-runtime-20260916",
                          "source_commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
                          "recorded_commit_count": len(added),
                          "recorded_at_utc": dt.datetime.now(dt.UTC).isoformat(),
                      },
                      indent=2,
                      sort_keys=True,
                  ) + "\n",
                  encoding="utf-8",
              )
          PY
          git add docs/project-state/CHANGE_LEDGER.jsonl docs/project-state/CURRENT_STATE.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(project-truth): backfill Rev2 reconstruction API commits [skip ci]"
          fi
      - name: Verify reconstruction state
        run: |
          uv run python -m scripts.generate_contracts --check
          uv run python scripts/project_truth_local.py verify
          uv run ruff check engine/source migrations/versions/0040_source_intelligence_automation_corpus.py tests/unit/test_automation_corpus_rev2.py tests/integration/test_automation_corpus_rev2.py
          uv run mypy engine/source
          uv run pytest tests/unit/test_automation_corpus_rev2.py -q
      - name: Push reconciled feature branch
        shell: bash
        run: |
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/feat/vekl-automation-corpus-runtime-20260916)" ]]; then
            git push origin HEAD:feat/vekl-automation-corpus-runtime-20260916
          fi
