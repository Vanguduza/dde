name: VEKL Rev2 reconstruction helper

on:
  push:
    branches:
      - feat/vekl-automation-corpus-runtime-20260916

permissions:
  contents: write

jobs:
  reconstruct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/vekl-automation-corpus-runtime-20260916
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --group dev
      - name: Configure reconstruction identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Apply Rev2 schema authority reconciliation
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          record_path = Path("schemas/objects/source_record.json")
          record = json.loads(record_path.read_text(encoding="utf-8"))
          status = record["properties"]["status"]["enum"]
          for value in ("NOT_CONFIGURED", "UNAVAILABLE"):
              if value not in status:
                  status.insert(status.index("BLOCKED"), value)
          record_path.write_text(json.dumps(record, separators=(",", ":")) + "\n", encoding="utf-8")

          for path in (
              Path("schemas/objects/vekl_resource.json"),
              Path("schemas/objects/vekl_research_finding.json"),
          ):
              schema = json.loads(path.read_text(encoding="utf-8"))
              for fk in schema["x-dde-storage"].get("foreign_keys", []):
                  if fk.get("ref_table") == "design_sources":
                      fk["ref_table"] = "source_records"
                  elif fk.get("ref_table") == "design_source_artifacts":
                      fk["ref_table"] = "source_artifacts"
              path.write_text(json.dumps(schema, separators=(",", ":")) + "\n", encoding="utf-8")

          migration = Path("migrations/versions/0040_source_intelligence_automation_corpus.py")
          if migration.exists():
              text = migration.read_text(encoding="utf-8")
              text = text.replace(
                  "CASE WHEN status IN ('AVAILABLE','DEGRADED','BLOCKED','DISABLED') THEN status ELSE 'BLOCKED' END",
                  "CASE WHEN status IN ('AVAILABLE','DEGRADED','NOT_CONFIGURED','UNAVAILABLE','BLOCKED','DISABLED') THEN status ELSE 'BLOCKED' END",
              )
              migration.write_text(text, encoding="utf-8")

          tables = Path("engine/source/tables.py")
          text = tables.read_text(encoding="utf-8")
          text = text.replace(
              '"""SQLAlchemy Core mappings for domain-neutral Source Intelligence and automation corpus."""',
              '"""SQLAlchemy Core mappings for domain-neutral Source Intelligence\nand the automation corpus."""',
          )
          tables.write_text(text, encoding="utf-8")
          PY
          git add schemas/objects/source_record.json schemas/objects/vekl_resource.json schemas/objects/vekl_research_finding.json migrations/versions/0040_source_intelligence_automation_corpus.py engine/source/tables.py
          if ! git diff --cached --quiet; then
            git commit -m "feat(vekl): bind VEKL provenance to neutral Source Intelligence"
          fi
      - name: Generate and commit canonical contract outputs
        shell: bash
        run: |
          uv run python -m scripts.generate_contracts
          uv run ruff format engine/source migrations/versions/0040_source_intelligence_automation_corpus.py tests/unit/test_automation_corpus_rev2.py
          git add engine/contracts schemas/sql/0001_stage1.sql schemas/sql/0001_stage1_down.sql docs/blueprint/generated/objects.md engine/source migrations/versions/0040_source_intelligence_automation_corpus.py tests/unit/test_automation_corpus_rev2.py
          if ! git diff --cached --quiet; then
            git commit -m "chore(contracts): regenerate neutral Source Intelligence outputs"
          fi
      - name: Backfill exact API-created commit evidence
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime as dt
          import hashlib
          import json
          import pathlib
          import subprocess

          ledger = pathlib.Path("docs/project-state/CHANGE_LEDGER.jsonl")
          current = pathlib.Path("docs/project-state/CURRENT_STATE.json")
          excludes = [
              ":(exclude)docs/project-state/CHANGE_LEDGER.jsonl",
              ":(exclude)docs/project-state/CURRENT_STATE.json",
          ]
          existing_lines = ledger.read_text(encoding="utf-8").splitlines() if ledger.exists() else []
          existing = []
          for line in existing_lines:
              try:
                  value = json.loads(line)
              except json.JSONDecodeError:
                  continue
              if isinstance(value, dict):
                  existing.append(value)
          base = subprocess.check_output(["git", "merge-base", "origin/main", "HEAD"], text=True).strip()
          commits = subprocess.check_output(["git", "rev-list", "--reverse", f"{base}..HEAD"], text=True).splitlines()
          added = []
          for sha in commits:
              parent = subprocess.check_output(["git", "rev-parse", f"{sha}^1"], text=True).strip()
              files = subprocess.check_output(
                  ["git", "diff", "--name-only", "--no-renames", parent, sha, "--", ".", *excludes],
                  text=True,
              ).splitlines()
              if not files or all(path.startswith("docs/project-state/") for path in files):
                  continue
              patch = subprocess.check_output(
                  ["git", "diff", "--binary", "--no-ext-diff", "--no-renames", parent, sha, "--", ".", *excludes]
              )
              digest = hashlib.sha256(patch).hexdigest()
              if any(row.get("commit_sha") == sha and row.get("diff_sha256") == digest for row in existing):
                  continue
              row = {
                  "schema_version": 1,
                  "kind": "commit-backfill",
                  "recorded_at_utc": dt.datetime.now(dt.UTC).isoformat(),
                  "branch": "feat/vekl-automation-corpus-runtime-20260916",
                  "commit_sha": sha,
                  "source_parent": parent,
                  "changed_files": files,
                  "diff_sha256": digest,
                  "actor": "github-actions[bot]:vekl-rev2-reconstruction",
              }
              existing_lines.append(json.dumps(row, sort_keys=True, separators=(",", ":")))
              existing.append(row)
              added.append(row)
          if added:
              ledger.write_text("\n".join(existing_lines) + "\n", encoding="utf-8")
              current.write_text(
                  json.dumps(
                      {
                          "schema_version": 1,
                          "state": "API_COMMIT_BACKFILL_RECONCILED",
                          "branch": "feat/vekl-automation-corpus-runtime-20260916",
                          "source_commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
                          "recorded_commit_count": len(added),
                          "recorded_at_utc": dt.datetime.now(dt.UTC).isoformat(),
                      },
                      indent=2,
                      sort_keys=True,
                  )
                  + "\n",
                  encoding="utf-8",
              )
          PY
          git add docs/project-state/CHANGE_LEDGER.jsonl docs/project-state/CURRENT_STATE.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(project-truth): backfill Rev2 reconstruction API commits [skip ci]"
          fi
      - name: Verify reconstruction state
        run: |
          uv run python -m scripts.generate_contracts --check
          uv run python scripts/project_truth_local.py verify
          uv run ruff check engine/source migrations/versions/0040_source_intelligence_automation_corpus.py tests/unit/test_automation_corpus_rev2.py
          uv run mypy engine/source
          uv run pytest tests/unit/test_automation_corpus_rev2.py -q
      - name: Push reconciled feature branch
        shell: bash
        run: |
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/feat/vekl-automation-corpus-runtime-20260916)" ]]; then
            git push origin HEAD:feat/vekl-automation-corpus-runtime-20260916
          fi
