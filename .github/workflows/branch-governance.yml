name: Branch Governance

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  branch-governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify repository governance artifacts
        run: python3 scripts/repository_governance.py verify-static
      - name: Audit remote branch lifecycle
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/repository_governance.py audit-remote
