# Written by the first-run wizard to %ProgramData%\DDE\config.toml
# Secrets stay on disk with ACLs restricted to Administrators + DDE service account.

[deployment]
mode = "local" # local | cloud

[local]
api_bind = "127.0.0.1"
api_port = 8000
database_url = "postgresql+asyncpg://dde:dde@127.0.0.1:5432/dde"
redis_url = "redis://127.0.0.1:6379/0"
object_store_root = "C:/ProgramData/DDE/artifacts"
compose_file = "C:/Program Files/DDE/docker-compose.appliance.yml"
execution_environment = "docker"
data_root = "C:/ProgramData/DDE"

[cloud]
api_base_url = ""
# When mode=cloud, local compose stack is not started.

[credentials]
# Populated by wizard. Never commit real values.
# Values may also be stored via Windows Credential Manager in later revisions.
admin_username = ""
# admin_password_ref = "wincred:DDE/AdminPassword"
# anthropic_api_key: backup only for Claude Code when auth_mode = api_key_backup
anthropic_api_key = ""
openai_api_key = ""
deepseek_api_key = ""
cursor_api_key = ""
github_token = ""

# Claude Code — subscription/OAuth is primary; API key is backup only.
# Secrets never live here. OAuth setup-tokens go to Windows Credential Manager;
# interactive login lives in Claude Code's own credential store (claude auth login).
# Docs: https://code.claude.com/docs/en/authentication
[claude_code]
auth_mode = "subscription" # subscription | api_key_backup
email = ""
session_status = "none" # none | pending_cli_login | verified_cli_login | stored_setup_token | blocked
oauth_token_ref = "" # e.g. wincred:DDE/ClaudeCodeOAuthToken — never the raw sk-ant-oat01-…
auth_source = "" # claude_auth_login | claude_auth_status | claude_setup_token | ""
auth_method = "" # from `claude auth status` when verified (e.g. claude.ai)
subscription_type = "" # pro | max | team | enterprise | "" when known
org_name = ""
blocked_reason = "" # set when CLI missing or Anthropic path blocked; may include doc URL

[docker]
required_for_workers = true
desktop_installer_url = "https://desktop.docker.com/win/main/amd64/Docker%20Desktop%20Installer.exe"
status = "unknown" # unknown | missing | installed_not_running | healthy
