[project]
name = "dde"
version = "0.1.0"
description = "Development & Engineering Engine — software manufacturing control plane"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "DDE" }]
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg",
  "alembic",
  "pydantic>=2",
  "pydantic-settings",
  "typer",
  "httpx",
  "structlog",
  "opentelemetry-sdk",
  "opentelemetry-instrumentation-fastapi",
  "redis",
]

[project.optional-dependencies]
cursor = [
  "cursor-sdk",
]
browser = [
  "playwright",
  "pillow",
]

[project.scripts]
# DDE-015's general command surface: `mission {create,status,trace}`,
# `task {list}` -- see `interfaces/cli/__main__.py` for the full subcommand
# structure and dispatch. No `mission run` orchestration command exists;
# see that module's docstring for why (no Chapter-chartered orchestrator
# component exists yet at Stage 1).
dde = "interfaces.cli.__main__:main"
dde-mcp = "interfaces.mcp.__main__:main"

[dependency-groups]
dev = [
  "pytest",
  "pytest-asyncio",
  "testcontainers",
  "ruff",
  "mypy",
  "hypothesis",
  "schemathesis",
  "pytest-cov",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine", "adapters", "interfaces", "scripts"]

[tool.ruff]
target-version = "py312"
src = ["engine", "adapters", "interfaces", "scripts", "tests"]
extend-exclude = ["migrations/script.py.mako"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "S", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["engine", "adapters", "interfaces", "scripts"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S108", "ASYNC240"]
"scripts/**" = ["S101"]
"migrations/**" = ["S608"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
files = ["engine"]
strict = true
warn_unreachable = true
disallow_any_unimported = true
disallow_untyped_decorators = true
no_implicit_reexport = true
show_error_codes = true

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
  # Tests that require live backing services (PostgreSQL, Redis). Deselected
  # by `just test-unit` so the pure suite runs on any host.
  "integration: requires live PostgreSQL/Redis",
]
filterwarnings = [
  "error",
  "ignore::DeprecationWarning",
  "ignore::starlette.exceptions.StarletteDeprecationWarning",
]

[tool.coverage.run]
source = ["engine", "adapters", "interfaces", "scripts"]
branch = true
